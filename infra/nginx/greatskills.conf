# nginx site config for the VPS.  ->  /etc/nginx/sites-available/greatskills.conf
#
#   sudo ln -s /etc/nginx/sites-available/greatskills.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# !! OTHER SITES ARE ALREADY ON THIS BOX. Do NOT delete sites-enabled/default
#    or any existing config: something is already serving those domains on
#    ports 80/443. This file is purely additive - every server block below is
#    matched by server_name, so nginx routes only these three hostnames here
#    and leaves the others untouched.
#
#    Before installing this, confirm what is actually in front of port 80:
#      sudo ss -tlnp | grep -E ':80|:443'
#    - nginx        -> this file works as written
#    - apache2      -> the other sites are on Apache; do not add nginx on top
#                      without a plan, they will fight over port 80
#    - a control panel (CyberPanel / CloudPanel / Plesk / HestiaCP / aaPanel)
#      -> add the domains THROUGH THE PANEL instead. Hand-written configs get
#         overwritten by the panel and its certbot integration will clash.
#
# Write it as plain HTTP first, then let certbot add TLS and the redirects:
#   sudo certbot --nginx -d greatskills.org -d www.greatskills.org \
#                        -d achievers.greatskills.org -d api.greatskills.org
# Certbot edits this file in place. Re-running it after edits is safe.

# Shared static-asset caching. Hashed filenames change every build, so they can
# cache forever; index.html must not, or visitors get yesterday's bundle.
map $sent_http_content_type $gs_cache {
    default                     "no-cache";
    ~*text/html                 "no-cache, must-revalidate";
    ~*javascript|css            "public, max-age=31536000, immutable";
    ~*image/|font/              "public, max-age=31536000, immutable";
}

server {
    listen 80;
    listen [::]:80;
    server_name greatskills.org www.greatskills.org;

    root /var/www/greatskills-web;
    index index.html;

    access_log /var/log/nginx/web.access.log;
    error_log  /var/log/nginx/web.error.log;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header Cache-Control $gs_cache always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Client-side routing: /about-us and /privacy-policy are not files on disk.
    # Without this every deep link and every refresh returns 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name achievers.greatskills.org;

    root /var/www/greatskills-portal;
    index index.html;

    access_log /var/log/nginx/portal.access.log;
    error_log  /var/log/nginx/portal.error.log;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header Cache-Control $gs_cache always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.greatskills.org;

    access_log /var/log/nginx/api.access.log;
    error_log  /var/log/nginx/api.error.log;

    # MAX_UPLOAD_MB is 10; leave headroom for multipart overhead.
    client_max_body_size 12m;

    # CORS is handled by FastAPI (see cors_origins in app/core/config.py).
    # Do NOT add CORS headers here too, or browsers reject the duplicates.
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
