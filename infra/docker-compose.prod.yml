# Production stack for the VPS. Standalone on purpose.
#
#   docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod up -d --build
#
# NOT an override of docker-compose.yml: Compose MERGES `ports` lists rather
# than replacing them, so an override can add a binding but can never remove
# one. Inheriting the dev file would leave its ports open no matter what we set.
#
# Postgres and Redis publish no ports at all here. They are reachable only over
# the internal compose network, by service name. The API publishes on loopback
# only, and nginx is what faces the internet.

name: greatskills

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in infra/.env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env.prod}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in infra/.env.prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in infra/.env.prod}
      - --appendonly
      - "yes"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    logging: *logging

  api:
    build:
      context: ../services/api
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # No default. If JWT_SECRET is unset the stack refuses to start rather
      # than silently signing tokens with a value that is public on GitHub.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in infra/.env.prod}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      # Outgoing mail. Optional: with SMTP_HOST empty the API logs and skips.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Who is emailed about new contact-form inquiries. Empty = saved only.
      NOTIFY_TO: ${NOTIFY_TO:-}
    # Loopback only. nginx terminates TLS and proxies here.
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    logging: *logging

volumes:
  pgdata:
  redisdata:
  uploads:
